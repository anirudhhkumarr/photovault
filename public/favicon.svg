<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Neon Blue to Purple/Magenta Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Luminous Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonGlow)" stroke="url(#neonGradient)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Top Stepped Layer (Vault Cap) -->
    <rect x="290" y="160" width="220" height="40" rx="16" stroke-width="14" fill="none" opacity="0.9" />
    <rect x="240" y="200" width="320" height="44" rx="18" stroke-width="14" fill="none" opacity="0.95" />

    <!-- Bottom Stepped Layer (Vault Base) -->
    <rect x="240" y="556" width="320" height="44" rx="18" stroke-width="14" fill="none" opacity="0.95" />
    <rect x="290" y="600" width="220" height="40" rx="16" stroke-width="14" fill="none" opacity="0.9" />

    <!-- Main Outer Body Frame -->
    <rect x="200" y="244" width="400" height="312" rx="42" stroke-width="16" fill="none" />

    <!-- Left & Right Vault Flanges / Corner Accents -->
    <path d="M 200 470 C 230 470 240 500 240 530" stroke-width="14" fill="none" />
    <path d="M 600 470 C 570 470 560 500 560 530" stroke-width="14" fill="none" />

    <!-- Outer Aperture Lens Ring -->
    <circle cx="400" cy="400" r="130" stroke-width="18" fill="none" />

    <!-- Inner Aperture Ring -->
    <circle cx="400" cy="400" r="100" stroke-width="12" stroke-dasharray="14 10" fill="none" opacity="0.8" />

    <!-- Camera Aperture Iris Blades (8 Interlocking Blades) -->
    <g stroke-width="10" opacity="0.95">
      <path d="M 400 300 L 442 372 A 40 40 0 0 1 390 360 Z" fill="none" />
      <path d="M 470 330 L 468 418 A 40 40 0 0 1 426 384 Z" fill="none" />
      <path d="M 500 400 L 442 450 A 40 40 0 0 1 432 406 Z" fill="none" />
      <path d="M 470 470 L 398 468 A 40 40 0 0 1 416 426 Z" fill="none" />
      <path d="M 400 500 L 358 428 A 40 40 0 0 1 410 440 Z" fill="none" />
      <path d="M 330 470 L 332 382 A 40 40 0 0 1 374 416 Z" fill="none" />
      <path d="M 300 400 L 358 350 A 40 40 0 0 1 368 394 Z" fill="none" />
      <path d="M 330 330 L 402 332 A 40 40 0 0 1 384 374 Z" fill="none" />
    </g>

    <!-- Center Aperture Hub / Pinhole -->
    <circle cx="400" cy="400" r="28" stroke-width="10" fill="#38BDF8" fill-opacity="0.3" />
    <circle cx="400" cy="400" r="10" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
